# Demo recording config. Differences from config/mini.toml are marked DEMO.
# mini configuration. Missing keys fall back to mini/harness/config.py DEFAULTS.

[local]
backend = "ollama"
url = "http://127.0.0.1:11434"
model = "gemma4:12b"
num_ctx = 65536
gpu_env = ""
launch_cmd = []
temperature = 0.6

[thinking]
parse = false
gap = false
spec = true
code = true
fix = true
execute = true
write = false     # text-only turns that deliver document content

[caps]
attempts_per_tool = 3          # DEMO ONLY: the default in config/mini.toml and the code is 10
task_wall_clock_s = 1200
task_turns = 30
run_hard_wall_clock_s = 3600
reply_max_tokens = 8192
reply_max_s = 300
tokens_per_run = 1500000
max_repairs_per_task = 2

[watchdogs]
identical_call_repeat = 3
passing_test_reruns = 2
file_rewrites = 3
fail_streak_restart = 3
parse_error_retries = 5
empty_reply_nudges = 1
swap_growth_mib = 250

[sandbox]
engine = "podman"
image = "mini-sandbox:base"
memory = "1g"
cpus = "2"
pids = 256
timeout_s = 180
service_network = "mini-net"
allowed_argv0 = ["python", "python3", "pytest", "ls", "cat", "head", "tail", "wc", "file", "pip"]

[approvals]
confirm_first = true
mode = "auto_visible"           # demo recording: dialogs are shown, then answered by the policy below
auto_approve = ["confirm", "permissions", "install", "cap"]
auto_delay_s = 3

[approvals.auto_choice]
confirm = "proceed"
cap = "hint"

[fallback]
enabled = false                 # DEMO: a take that fails 3 attempts is restarted instead
provider = "claude_cli"
model = "sonnet"
attempts_per_tool = 3
tokens_per_run = 60000
spend_usd_per_run = 0.5
max_output_tokens = 8000
price_in_per_mtok = 3.75
price_out_per_mtok = 15.0
timeout_s = 300

[consult]
enabled = true
extra_attempts = 3
max_rounds = 1

[lessons]
enabled = true
max_in_prompt = 3

[environment]
# Facts about the user's environment, shown to the agent as given (like a user telling an assistant about
# their setup). Set by the user, never by the agent.
facts = [
  "Outgoing email: SMTP server at host mailpit, port 1025, plain SMTP without TLS and without authentication. Send from mini@example.local.",
]

[paths]
state = "state"
runs = "runs"
