# mini configuration. Missing keys fall back to mini/harness/config.py DEFAULTS.

[local]
# The local tier. `use` lists backends from [backends.*] in order of preference; mini setup writes them.
backend = "openai"
url = "http://127.0.0.1:8080/v1"
model = "gemma4-12b-it-qat"
temperature = 0.6
use = ["llamacpp"]

[llamacpp]
# mini setup builds the pinned llama.cpp release in `dir` and runs llama-server in router mode over
# `models_dir`: every NAME.gguf (or NAME/ folder with the model and its mmproj-*.gguf) is a model mini can use.
dir = "/mnt/disk_a/llama.cpp"
models_dir = "/mnt/disk_a/models"
port = 8080
device = "Vulkan0"       # llama-server --list-devices
ctx = 65536              # context per model
models_max = 1           # models in VRAM at once; others load on demand
extra_args = "-fa on -ctk q8_0 -ctv q8_0 --jinja --reasoning-format auto --parallel 1 --cache-ram 1024"
preset = "rtx3070"       # the active entry of [presets.*]; `mini preset use NAME` switches
gpu = "vulkan"           # build used when no preset is active: vulkan | cuda | cpu

[thinking]
parse = true
gap = true
spec = true
code = true
fix = true
execute = true
write = true     # text-only turns that deliver document content

[caps]
attempts_per_tool = 10
task_wall_clock_s = 1200
task_turns = 30
run_hard_wall_clock_s = 99999999
reply_max_tokens = 8192
reply_max_s = 300
reply_max_tokens_tools = 6144
reply_comment_cut_chars = 4000
reply_think_budget_tokens = 2000
reply_think_max_chars = 14000
tokens_per_run = 1500000
max_repairs_per_task = 2

[watchdogs]
identical_call_repeat = 3
passing_test_reruns = 2
file_rewrites = 3
fail_streak_restart = 3
parse_error_retries = 5
empty_reply_nudges = 1
swap_growth_mib = 250
swap_watch = false      # true: abort a run when swap grows by swap_growth_mib

[sandbox]
engine = "podman"
image = "mini-sandbox:base"
memory = "1g"
cpus = "2"
pids = 256
timeout_s = 180
service_network = "mini-net"
allowed_argv0 = ["python", "python3", "pytest", "ls", "cat", "head", "tail", "wc", "file", "pip"]

[approvals]
confirm_first = true
mode = "ask"
auto_approve = []

[approvals.auto_choice]
confirm = "proceed"
cap = "hint"

# Cloud tiers go through OmniRoute (http://127.0.0.1:20128). The model names are OmniRoute combos: pick the
# actual models in its dashboard. The API key is read from $OMNIROUTE_API_KEY or ~/.config/mini/env.
[free]
enabled = true
backend = "openai"
url = "http://127.0.0.1:20128/v1"
model = "mini-free"
api_key_env = "OMNIROUTE_API_KEY"
temperature = 0.4
thinking_controls = false
tokens_per_run = 3000000

[paid]
enabled = false
backend = "openai"
url = "http://127.0.0.1:20128/v1"
model = "mini-paid"
api_key_env = "OMNIROUTE_API_KEY"
temperature = 0.4
thinking_controls = false
tokens_per_run = 2000000

[consult]
enabled = true
extra_attempts = 3
max_rounds = 1

[web]
hosts = []               # hosts web_fetch may read without asking ("example.org"); others need your approval per task

[tools]
auto_accept = false      # tools built in a task stay staged until you accept them (mini tools accept NAME)
bin_dir = "~/.local/bin" # accepted tools get a command here

[lessons]
enabled = true
max_in_prompt = 3

[environment]
# Facts about the user's environment, shown to the agent as given (like a user telling an assistant about
# their setup). Set by the user, never by the agent.
facts = []

[paths]
state = "state"
runs = "runs"

[backends.llamacpp]
backend = "openai"
url = "http://127.0.0.1:8080/v1"
model = "gemma4-12b-it-qat"

# Named ways to run llama-server (gpu, device, model, ctx, models_max, extra_args), laid over [llamacpp].
[presets.rx6700xt]
gpu = "vulkan"
device = "Vulkan0"
model = "gemma4-12b"
ctx = 65536
extra_args = "-fa on -ctk q8_0 -ctv q8_0 --jinja --reasoning-format auto --parallel 1 --cache-ram 1024"

[presets.rtx3070]
gpu = "cuda"
device = "CUDA0"
model = "gemma4-12b-it-qat"
ctx = 40960
extra_args = "-fa on -ctk q8_0 -ctv q8_0 --jinja --reasoning-format auto --parallel 1 --cache-ram 1024 --no-mmproj-offload"

# The folder mini is started in is where it works. It must be a git repository: every task is checkpointed in a
# hidden ref (refs/mini/<run>) and `mini undo` restores it.
[workspace]
refuse = ["~", "/"]
