# mini configuration. Missing keys fall back to mini/harness/config.py DEFAULTS.

[local]
# llama.cpp llama-server (systemd user unit llama-server.service, Vulkan, 64k context set there).
# For Ollama instead: backend = "ollama", url = "http://127.0.0.1:11434".
backend = "openai"
url = "http://127.0.0.1:8080/v1"
model = "gemma4:12b"
num_ctx = 65536          # used by the ollama backend only
gpu_env = ""
launch_cmd = []
temperature = 0.6
use = ["llamacpp", "ollama"]

[thinking]
parse = false
gap = false
spec = true
code = true
fix = true
execute = true
write = false     # text-only turns that deliver document content

[caps]
attempts_per_tool = 10
task_wall_clock_s = 1200
task_turns = 30
run_hard_wall_clock_s = 3600
reply_max_tokens = 8192
reply_max_s = 300
tokens_per_run = 1500000
max_repairs_per_task = 2

[watchdogs]
identical_call_repeat = 3
passing_test_reruns = 2
file_rewrites = 3
fail_streak_restart = 3
parse_error_retries = 5
empty_reply_nudges = 1
swap_growth_mib = 250

[sandbox]
engine = "podman"
image = "mini-sandbox:base"
memory = "1g"
cpus = "2"
pids = 256
timeout_s = 180
service_network = "mini-net"
allowed_argv0 = ["python", "python3", "pytest", "ls", "cat", "head", "tail", "wc", "file", "pip"]

[approvals]
confirm_first = true
mode = "ask"
auto_approve = []

[approvals.auto_choice]
confirm = "proceed"
cap = "hint"

# Cloud tiers go through OmniRoute (http://127.0.0.1:20128). The model names are OmniRoute combos: pick the
# actual models in its dashboard. The API key is read from $OMNIROUTE_API_KEY or ~/.config/mini/env.
[free]
enabled = true
backend = "openai"
url = "http://127.0.0.1:20128/v1"
model = "mini-free"
api_key_env = "OMNIROUTE_API_KEY"
temperature = 0.4
thinking_controls = false
tokens_per_run = 3000000

[paid]
enabled = true
backend = "openai"
url = "http://127.0.0.1:20128/v1"
model = "mini-paid"
api_key_env = "OMNIROUTE_API_KEY"
temperature = 0.4
thinking_controls = false
tokens_per_run = 2000000

[routing]
start = "local"          # local | free | paid
local_budget_s = 900     # local model time per task, then the task moves to free
auto_escalate = true     # local -> free without asking; paid is only used when you pick it

[consult]
enabled = true
extra_attempts = 3
max_rounds = 1

[tools]
auto_accept = false      # tools built in a task stay staged until you accept them (mini tools accept NAME)
bin_dir = "~/.local/bin" # accepted tools get a command here

[lessons]
enabled = true
max_in_prompt = 3

[environment]
# Facts about the user's environment, shown to the agent as given (like a user telling an assistant about
# their setup). Set by the user, never by the agent.
facts = []

[paths]
state = "state"
runs = "runs"

[backends.llamacpp]
backend = "openai"
url = "http://127.0.0.1:8080/v1"
model = "gemma4:12b"
gguf = "ollama:gemma4:12b"

[backends.ollama]
backend = "ollama"
url = "http://127.0.0.1:11434"
model = "gemma4:12b"
