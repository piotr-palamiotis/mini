# mini's shared settings (in git). This machine's own settings (model, GPU, presets, paths) go in
# ~/.config/mini/mini.toml, laid over this file: `mini setup` and `mini preset` write there. Missing keys fall back
# to mini/harness/config.py DEFAULTS.

[local]
# The model, served by mini's own llama-server. The active preset's model takes the place of `model`.
backend = "openai"
model = "gemma4-12b"
temperature = 0.6

[llamacpp]
# mini setup builds the pinned llama.cpp release in `dir` and runs llama-server in router mode over
# `models_dir`: every NAME.gguf (or NAME/ folder with the model and its mmproj-*.gguf) is a model mini can use.
dir = "~/llama.cpp"
models_dir = "~/models"
port = 8080
device = ""              # e.g. Vulkan0, CUDA0 (llama-server --list-devices); empty: setup asks
ctx = 65536              # context per model
models_max = 1           # models in VRAM at once; others load on demand
extra_args = "-fa on -ctk q8_0 -ctv q8_0 --jinja --reasoning-format auto --parallel 1 --cache-ram 1024"
preset = ""              # the active entry of [presets.*]; `mini preset use NAME` switches
gpu = "vulkan"           # build used when no preset is active: vulkan | cuda | cpu

[thinking]
parse = true
gap = true
spec = true
code = true
fix = true
execute = true
write = true     # text-only turns that deliver document content

[caps]
attempts_per_tool = 10
task_wall_clock_s = 1200
task_turns = 30
run_hard_wall_clock_s = 99999999
reply_max_tokens = 8192
reply_max_s = 300
reply_max_tokens_tools = 6144
reply_comment_cut_chars = 4000
reply_think_budget_tokens = 2000
reply_think_max_chars = 14000
tokens_per_run = 1500000
max_repairs_per_task = 2

[watchdogs]
identical_call_repeat = 3
passing_test_reruns = 2
file_rewrites = 3
fail_streak_restart = 3
parse_error_retries = 5
empty_reply_nudges = 1
swap_growth_mib = 250
swap_watch = false      # true: abort a run when swap grows by swap_growth_mib

[sandbox]
engine = "podman"
image = "mini-sandbox:base"
memory = "1g"
cpus = "2"
pids = 256
timeout_s = 180
service_network = "mini-net"
allowed_argv0 = ["python", "python3", "pytest", "ls", "cat", "head", "tail", "wc", "file", "pip"]

[approvals]
confirm_first = true
mode = "ask"
auto_approve = []

[approvals.auto_choice]
confirm = "proceed"
cap = "hint"

[consult]
enabled = true
extra_attempts = 3
max_rounds = 1

[web]
hosts = []               # hosts web_fetch may read without asking ("example.org"); others need your approval per task

[tools]
auto_accept = false      # tools built in a task stay staged until you accept them (mini tools accept NAME)
bin_dir = "~/.local/bin" # accepted tools get a command here

[lessons]
enabled = true
max_in_prompt = 3

[environment]
# Facts about the user's environment, shown to the agent as given (like a user telling an assistant about
# their setup). Set by the user, never by the agent.
facts = []

[paths]
state = "state"
runs = "runs"

# [presets.*] (named ways to run llama-server: model, GPU, context) live in ~/.config/mini/mini.toml.

# The folder mini is started in is where it works. It must be a git repository: every task is checkpointed in a
# hidden ref (refs/mini/<run>) and `mini undo` restores it.
[workspace]
refuse = ["~", "/"]
